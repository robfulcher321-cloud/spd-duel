name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          chmod +x gradlew
          SPD_BUILD=${{ github.run_number }} ./gradlew --no-daemon --stacktrace android:assembleDebug 2>&1 | tee build.log
        continue-on-error: true

      - name: Self-test (desktop build on a virtual screen)
        id: selftest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          set -o pipefail
          SPD_SELFTEST=1 SPD_BUILD=${{ github.run_number }} timeout 900 xvfb-run -a -s "-screen 0 1280x1024x24" \
            ./gradlew --no-daemon desktop:debug 2>&1 | tee selftest.log
          grep -q "SELFTEST PASS" selftest.log

      - name: Match tests (several copies of the game fighting over localhost)
        id: dueltest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          ./gradlew --no-daemon -q desktop:release
          JAR=$(ls desktop/build/libs/*.jar | head -1)
          run_match () {
            NAME=$1; PLAYERS=$2; MODE=$3; DISCOVER=$4
            echo "=== match $NAME: $PLAYERS players, $MODE"
            SPD_DUELTEST=host SPD_DUELPLAYERS=$PLAYERS SPD_DUELMODE=$MODE XDG_DATA_HOME=/tmp/${NAME}_h \
              timeout 360 xvfb-run -n 91 -s "-screen 0 1024x768x24" java -jar "$JAR" > ${NAME}_host.log 2>&1 &
            PIDS="$!"
            for SEAT in $(seq 1 $((PLAYERS-1))); do
              sleep 1
              SPD_DUELTEST=join SPD_DUELSEAT=$SEAT SPD_DUELDISCOVER=$DISCOVER XDG_DATA_HOME=/tmp/${NAME}_j$SEAT \
                timeout 360 xvfb-run -n $((91+SEAT)) -s "-screen 0 1024x768x24" java -jar "$JAR" > ${NAME}_join$SEAT.log 2>&1 &
              PIDS="$PIDS $!"
            done
            for P in $PIDS; do wait $P || true; done
            OK=1
            for F in ${NAME}_*.log; do grep -q "\] PASS" $F || { echo "no PASS in $F"; OK=0; }; done
            [ $OK = 1 ]
          }
          R=0
          run_match ffa3 3 ffa || R=1
          run_match team3 3 2v1 probe || R=1
          exit $R

      - name: Publish build log to ci-log branch
        if: always()
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/ 2>/dev/null || echo "no log" > /tmp/log/build.log
          cp selftest.log /tmp/log/ 2>/dev/null || true
          cp ffa3_*.log team3_*.log /tmp/log/ 2>/dev/null || true
          cp -r desktop/selftest /tmp/log/screens 2>/dev/null || true
          mkdir -p /tmp/log/screens && cp selftest/*.png /tmp/log/screens/ 2>/dev/null || true
          echo "result=${{ steps.build.outcome }}" > /tmp/log/status.txt
          echo "selftest=${{ steps.selftest.outcome }}" >> /tmp/log/status.txt
          echo "dueltest=${{ steps.dueltest.outcome }}" >> /tmp/log/status.txt
          echo "commit=${{ github.sha }}" >> /tmp/log/status.txt
          cd /tmp/log
          git init -q -b ci-log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add . && git commit -q -m "Build log for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-log

      - name: Publish APK as the "latest" release
        if: steps.build.outcome == 'success' && steps.selftest.outcome == 'success' && steps.dueltest.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/build/outputs/apk/debug/android-debug.apk SPD-Duel.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SPD-Duel.apk \
            --title "SPD Duel build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Download SPD-Duel.apk on your phone and install it."

      - name: Fail the job if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
