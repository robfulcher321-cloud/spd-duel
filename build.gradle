buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.0'
    }
}

allprojects {

    ext {
        appName = 'SPD Duel'
        appPackageName = 'com.robfulcher.spdduel'

        //Full releases gets +2 on version code, needed for an F-Droid quirk
        //SPD Duel: every GitHub build gets a higher number so phones can tell when there's an update
        def duelBuild = System.getenv('SPD_BUILD') ? Integer.parseInt(System.getenv('SPD_BUILD')) : 0
        appVersionCode = 2000 + duelBuild
        appVersionName = '4.0.2-b' + duelBuild

        appJavaCompatibility = JavaVersion.VERSION_11

        appAndroidCompileSDK = 36   //Android 15
        appAndroidMinSDK = 21       //Android 5.0
        appAndroidTargetSDK = 36    //Android 15

        gdxVersion = '1.14.0'
        gdxControllersVersion = '2.2.4'
        robovmVersion = '2.3.24'
    }
    version = appVersionName

    repositories {
        google()
        mavenCentral()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }

}